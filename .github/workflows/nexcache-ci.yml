name: NexCache CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential pkg-config tcl8.6 tclx libssl-dev git libgtest-dev

    - name: Build NexCache (Rubin M3.3 Mode)
      run: |
        # MALLOC=libc: the bundled deps/jemalloc has no generated ./configure
        # script in this checkout, so the default jemalloc build fails on a
        # clean Linux runner (jemalloc/jemalloc.h: No such file or directory).
        # BUILD_RDMA=no: BUILD_RDMA defaults to yes, linking -lrdmacm -libverbs,
        # which this runner does not have installed (no InfiniBand/RoCE
        # hardware to test against here anyway).
        make -j$(nproc) RUBIN_MODE=1 MALLOC=libc BUILD_RDMA=no EXTRA_CFLAGS="-D_GNU_SOURCE"
      continue-on-error: false

    - name: Verify Executables
      run: |
        ls -l src/nexcache-server
        ./src/nexcache-server --version

    - name: Run Core Tests (Stabilized)
      run: |
        # Usiamo --clients 1 per evitare race condition sui test TTL/Replication in CI
        # Timeout alzato a 1200 per gestire carichi pesanti in VERA-Mode
        ./runtest --verbose --tags -slow --dump-logs --timeout 1200 --clients 1
